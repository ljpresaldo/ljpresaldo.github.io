<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>art | lei jo</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .page-subtitle {
            color: #888;
            font-size: 0.88rem;
            margin-bottom: 0;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 2rem;
            margin-top: 2.5rem;
        }

        .painting-card {
            cursor: pointer;
            border: 1px solid #e8e8e8;
            transition: box-shadow 0.15s;
        }

        .painting-card:hover {
            box-shadow: 3px 4px 14px rgba(0,0,0,0.08);
        }

        .painting-img-wrap {
            width: 100%;
            background: #fafafa;
        }

        .painting-img-wrap img {
            width: 100%;
            height: auto;
            display: block;
            transition: opacity 0.2s;
        }

        .painting-card:hover .painting-img-wrap img {
            opacity: 0.92;
        }

        .painting-meta {
            padding: 0.85rem 1rem;
            border-top: 1px solid #f0f0f0;
        }

        .painting-title {
            font-size: 0.88rem;
            font-weight: bold;
            color: #1a1a1a;
            margin-bottom: 0.2rem;
        }

        .painting-date {
            font-size: 0.78rem;
            color: #aaa;
            margin-bottom: 0.4rem;
        }

        .painting-status {
            display: inline-block;
            font-size: 0.7rem;
            padding: 0.1rem 0.45rem;
            border: 1px solid;
        }

        .status-available { color: #6B8E66; border-color: #6B8E66; }
        .status-sold      { color: #aaa;    border-color: #ddd; }
        .status-nfs       { color: #888;    border-color: #ccc; }

        /* ── modal ── */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(255,255,255,0.92);
            z-index: 1000;
            overflow-y: auto;
        }

        .modal-overlay.open { display: flex; align-items: flex-start; justify-content: center; padding: 4rem 2rem; }

        .modal-box {
            background: #fff;
            border: 1px solid #e0e0e0;
            max-width: 820px;
            width: 100%;
            box-shadow: 4px 6px 24px rgba(0,0,0,0.08);
        }

        .modal-titlebar {
            background: #f2f2f2;
            border-bottom: 1px solid #e0e0e0;
            padding: 0.5rem 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .modal-dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            background: #ddd;
            cursor: pointer;
        }

        .modal-dot:first-child { background: #ff6b6b; }

        .modal-name {
            font-size: 0.72rem;
            color: #aaa;
            margin-left: 0.3rem;
            font-family: 'Courier New', monospace;
        }

        .modal-body {
            display: flex;
            gap: 0;
        }

        .modal-img {
            flex: 1.2;
            min-width: 0;
        }

        .modal-img img {
            width: 100%;
            height: auto;
            display: block;
        }

        .modal-info {
            flex: 1;
            padding: 1.8rem 1.6rem;
            border-left: 1px solid #f0f0f0;
            min-width: 0;
        }

        .modal-title {
            font-size: 1rem;
            font-weight: bold;
            color: #1a1a1a;
            margin-bottom: 0.3rem;
        }

        .modal-date {
            font-size: 0.78rem;
            color: #aaa;
            margin-bottom: 0.6rem;
        }

        .modal-status {
            display: inline-block;
            font-size: 0.7rem;
            padding: 0.1rem 0.45rem;
            border: 1px solid;
            margin-bottom: 1.4rem;
        }

        .modal-section-label {
            font-size: 0.7rem;
            color: #bbb;
            letter-spacing: 0.06em;
            text-transform: lowercase;
            margin-bottom: 0.4rem;
        }

        .modal-text {
            font-size: 0.82rem;
            color: #555;
            line-height: 1.75;
            margin-bottom: 1.2rem;
        }

        .modal-medium {
            font-size: 0.78rem;
            color: #aaa;
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="page-title">
        <h1>art ✦</h1>
        <p class="page-subtitle">things i made with my hands</p>
    </div>

    <hr class="divider">

    <div class="gallery" id="gallery"></div>

    <!-- modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <div class="modal-titlebar">
                <span class="modal-dot" id="modalClose"></span>
                <span class="modal-dot"></span>
                <span class="modal-dot"></span>
                <span class="modal-name" id="modalFilename"></span>
            </div>
            <div class="modal-body">
                <div class="modal-img"><img id="modalImg" src="" alt=""></div>
                <div class="modal-info">
                    <p class="modal-title" id="modalTitle"></p>
                    <p class="modal-date" id="modalDate"></p>
                    <span class="modal-status painting-status" id="modalStatus"></span>
                    <p class="modal-section-label">about</p>
                    <p class="modal-text" id="modalAbout"></p>
                    <p class="modal-section-label">process</p>
                    <p class="modal-text" id="modalProcess"></p>
                    <p class="modal-medium" id="modalMedium"></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const paintings = [
            {
                img: 'images/painting-lily.jpeg',
                title: 'lily pond',
                date: 'june 2026',
                dimensions: '50 × 60 cm',
                status: 'sold',
                medium: 'acrylic on canvas',
                about: 'saw a photo of ninoy aquino wildlife center on facebook and had the urge to order a canvas, cheap brushes on grabmart, and paint. started at 11pm and finished at 5am. with classes the next day.',
                process: 'my first serious painting on canvas after stopping in elementary. really a surreal moment because now i\'m painting more than ever.',
            },
            {
                img: 'images/painting-oranges.jpeg',
                title: 'still life with blood oranges',
                date: 'august 2026',
                dimensions: '60 × 80 cm',
                status: 'available',
                medium: 'acrylic on canvas',
                about: 'one of the reasons i think i finally rediscovered my drive to make art was consuming lots of it. one artist i love catching on my feed is maddie grace art. she shows her process and her style resonates w me: to not overthink imperfections, carefree, fluid. this piece is a study of one of her paintings.',
                process: 'painted on my balcony, which i\'ve been loving recently. started around 7pm and finished around 1am.',
            },
        ];

        const statusLabel = { available: 'available', sold: 'sold', nfs: 'not for sale' };
        const statusClass = { available: 'status-available', sold: 'status-sold', nfs: 'status-nfs' };

        const gallery = document.getElementById('gallery');
        paintings.forEach((p, i) => {
            const card = document.createElement('div');
            card.className = 'painting-card';
            card.innerHTML = `
                <div class="painting-img-wrap"><img src="${p.img}" alt="${p.title}" loading="lazy"></div>
                <div class="painting-meta">
                    <p class="painting-title">${p.title}</p>
                    <p class="painting-date">${p.date} · ${p.dimensions}</p>
                    <span class="painting-status ${statusClass[p.status]}">${statusLabel[p.status]}</span>
                </div>`;
            card.addEventListener('click', () => openModal(p));
            gallery.appendChild(card);
        });

        function openModal(p) {
            document.getElementById('modalImg').src = p.img;
            document.getElementById('modalImg').alt = p.title;
            document.getElementById('modalFilename').textContent = p.title + '.jpg';
            document.getElementById('modalTitle').textContent = p.title;
            document.getElementById('modalDate').textContent = p.date + ' · ' + p.dimensions;
            const st = document.getElementById('modalStatus');
            st.textContent = statusLabel[p.status];
            st.className = 'modal-status painting-status ' + statusClass[p.status];
            document.getElementById('modalAbout').textContent = p.about;
            document.getElementById('modalProcess').textContent = p.process;
            document.getElementById('modalMedium').textContent = p.medium;
            document.getElementById('modalOverlay').classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        document.getElementById('modalClose').addEventListener('click', closeModal);
        document.getElementById('modalOverlay').addEventListener('click', e => {
            if (e.target === document.getElementById('modalOverlay')) closeModal();
        });
        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('open');
            document.body.style.overflow = '';
        }
    </script>
    <script src="sidebar.js"></script>
</body>
</html>
