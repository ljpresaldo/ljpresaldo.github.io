<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lei jo</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .notes-area {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.4rem;
            align-items: start;
            padding-top: 1rem;
        }

        .note {
            background: #fff;
            border: 1px solid #e0e0e0;
            box-shadow: 2px 3px 10px rgba(0,0,0,0.06);
            font-family: 'Courier New', monospace;
            font-size: 0.82rem;
            line-height: 1.75;
            color: #333;
        }

        .note-titlebar {
            background: #f2f2f2;
            border-bottom: 1px solid #e0e0e0;
            padding: 0.45rem 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .note-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ddd;
            flex-shrink: 0;
        }

        .note-title {
            font-size: 0.72rem;
            color: #aaa;
            margin-left: 0.3rem;
            letter-spacing: 0.02em;
        }

        .note-body {
            padding: 1rem 1.1rem 1.2rem;
        }

        .note-body p {
            font-size: 0.82rem;
            color: #444;
            margin-bottom: 0.75rem;
            line-height: 1.75;
        }

        .note-body p:last-child { margin-bottom: 0; }

        /* slight rotations for the scattered feel */
        .note:nth-child(1) { transform: rotate(-1.2deg); }
        .note:nth-child(2) { transform: rotate(0.8deg); margin-top: 1.8rem; }
        .note:nth-child(3) { transform: rotate(-0.5deg); }
        .note:nth-child(4) { transform: rotate(1deg); margin-top: 0.8rem; }

        .note-lyric {
            font-size: 0.82rem;
            color: #888;
            font-style: italic;
            margin: 0;
            line-height: 1.6;
        }
        .note-lyric-attr {
            font-size: 0.7rem;
            color: #ccc;
            margin: 0.4rem 0 0 0;
            font-style: normal;
        }

        .currently {
            font-size: 0.8rem;
            color: #aaa;
            font-family: 'Courier New', monospace;
            margin-bottom: 0;
            min-height: 1.2em;
        }
        .currently .word { color: #6B8E66; }
    </style>
</head>
<body>
    <div class="notes-area">

        <div class="note">
            <div class="note-titlebar">
                <span class="note-dot"></span>
                <span class="note-dot"></span>
                <span class="note-dot"></span>
                <span class="note-title">untitled.txt</span>
            </div>
            <div class="note-body">
                <p>hi i'm lj! i like to do anything HAHAH</p>
            </div>
        </div>

        <div class="note">
            <div class="note-titlebar">
                <span class="note-dot"></span>
                <span class="note-dot"></span>
                <span class="note-dot"></span>
                <span class="note-title">whats this</span>
            </div>
            <div class="note-body">
                <p>a random project i wanted to do during summer 2026. inspired by the fact that i always have 318732 tabs open and 423784 sticky notes.</p>
            </div>
        </div>

        <div class="note">
            <div class="note-titlebar">
                <span class="note-dot"></span>
                <span class="note-dot"></span>
                <span class="note-dot"></span>
                <span class="note-title">welcome</span>
            </div>
            <div class="note-body">
                <p>welcome to my little corner on the internet ✦</p>
            </div>
        </div>

    </div>

    <script src="sidebar.js"></script>
</body>
</html>
