<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>leitseat | lei jo</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .search-bar {
            width: 100%;
            padding: 0.5rem 0.75rem;
            font-family: 'Courier New', monospace;
            font-size: 0.88rem;
            border: 1px solid #ddd;
            background: #fff;
            color: #1a1a1a;
            outline: none;
            margin-bottom: 0.9rem;
        }

        .search-bar:focus {
            border-color: #6B8E66;
        }

        .filter-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.45rem;
            margin-bottom: 1.4rem;
        }

        .filter-btn {
            font-family: 'Courier New', monospace;
            font-size: 0.82rem;
            padding: 0.25rem 0.65rem;
            border: 1px solid #ccc;
            background: #fff;
            color: #555;
            cursor: pointer;
            transition: all 0.15s;
        }

        .filter-btn:hover {
            border-color: #6B8E66;
            color: #6B8E66;
        }

        .filter-btn.active {
            background: #6B8E66;
            border-color: #6B8E66;
            color: #fff;
        }

        .count {
            font-size: 0.8rem;
            color: #aaa;
            margin-bottom: 0.9rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead th {
            text-align: left;
            font-size: 0.78rem;
            color: #aaa;
            font-weight: normal;
            padding: 0 0.6rem 0.6rem 0.6rem;
            border-bottom: 1px solid #e8e8e8;
            letter-spacing: 0.03em;
            white-space: nowrap;
        }

        tbody tr.entry-row {
            cursor: pointer;
            border-bottom: 1px solid #f0f0f0;
            transition: background 0.1s;
        }

        tbody tr.entry-row:hover {
            background: #fafafa;
        }

        tbody tr.entry-row td {
            padding: 0.65rem 0.6rem;
            font-size: 0.88rem;
            vertical-align: middle;
        }

        tbody tr.entry-row td.place-cell {
            color: #555;
            white-space: nowrap;
        }

        tbody tr.entry-row td.date-cell {
            color: #aaa;
            font-size: 0.82rem;
            white-space: nowrap;
        }

        .stars {
            color: #6B8E66;
            letter-spacing: 1px;
            white-space: nowrap;
            font-size: 0.82rem;
        }

        .tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem;
        }

        .tag {
            font-size: 0.75rem;
            color: #888;
            border: 1px solid #e0e0e0;
            padding: 0.1rem 0.4rem;
        }

        /* expand row */
        tr.expand-row td {
            padding: 0;
            border-bottom: 1px solid #e8e8e8;
        }

        .expand-inner {
            padding: 0.8rem 0.6rem 1rem 0.6rem;
            font-size: 0.85rem;
            color: #555;
            background: #fafafa;
            display: none;
        }

        .chevron {
            font-size: 0.7rem;
            color: #bbb;
            margin-left: 0.3rem;
            transition: transform 0.15s;
            display: inline-block;
        }

        tr.entry-row.open .chevron {
            transform: rotate(90deg);
        }

        .show-more-row td {
            padding-top: 1rem;
            font-size: 0.82rem;
            color: #aaa;
            text-align: center;
        }

        .show-more-btn {
            background: none;
            border: 1px solid #ddd;
            font-family: 'Courier New', monospace;
            font-size: 0.82rem;
            color: #888;
            padding: 0.3rem 1rem;
            cursor: pointer;
        }

        .show-more-btn:hover {
            border-color: #6B8E66;
            color: #6B8E66;
        }

        .expand-title {
            font-weight: bold;
            font-size: 0.92rem;
            color: #1a1a1a;
            margin-bottom: 0.55rem;
        }

        /* photo carousel */
        .expand-content {
            display: flex;
            gap: 1.5rem;
            align-items: flex-start;
        }

        .expand-notes {
            flex: 1;
            min-width: 0;
        }

        .expand-notes p {
            font-size: 0.85rem;
            color: #555;
            margin: 0;
            line-height: 1.6;
        }

        .carousel {
            flex-shrink: 0;
            width: 220px;
        }

        .carousel-img-wrap {
            width: 220px;
            height: 165px;
            background: #f0f0f0;
            border: 1px solid #e8e8e8;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .carousel-img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .carousel-no-img {
            font-size: 0.78rem;
            color: #ccc;
            font-family: 'Courier New', monospace;
        }

        .carousel-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 0.4rem;
        }

        .carousel-btn {
            background: none;
            border: 1px solid #e0e0e0;
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
            color: #888;
            padding: 0.15rem 0.5rem;
            cursor: pointer;
            line-height: 1;
        }

        .carousel-btn:hover:not(:disabled) {
            border-color: #6B8E66;
            color: #6B8E66;
        }

        .carousel-btn:disabled {
            opacity: 0.3;
            cursor: default;
        }

        .carousel-count {
            font-size: 0.75rem;
            color: #bbb;
            font-family: 'Courier New', monospace;
        }

        .empty {
            text-align: center;
            color: #bbb;
            font-size: 0.85rem;
            padding: 2rem 0;
        }

        .wip-banner {
            font-size: 0.8rem;
            color: #bbb;
            border: 1px dashed #e0e0e0;
            padding: 0.5rem 0.8rem;
            margin-bottom: 2rem;
            display: inline-block;
        }
    </style>
</head>
<body>

    <div class="page-title">
        <h1>leitseat ✦</h1>
        <p>food stuff! documenting food and friends</p>
    </div>

    <hr class="divider">

    <p class="wip-banner">work in progress.</p>

    <script src="sidebar.js"></script>
</body>
</html>
