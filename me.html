<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>me — lei jo</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .fav-section {
            margin-bottom: 2rem;
        }

        .fav-section h2 {
            margin-bottom: 0.6rem;
        }

        .fav-list {
            list-style: none;
            margin: 0;
        }

        .fav-list li {
            font-size: 0.9rem;
            color: #444;
            padding: 0.3rem 0;
            border-bottom: 1px solid #f5f5f5;
            display: flex;
            align-items: baseline;
            gap: 0.6rem;
        }

        .fav-list li:last-child {
            border-bottom: none;
        }

        .fav-list li:before { content: none; }

        .fav-dot {
            color: #6B8E66;
            font-size: 0.7rem;
            flex-shrink: 0;
        }

        .fav-note {
            color: #bbb;
            font-size: 0.8rem;
            margin-left: auto;
            white-space: nowrap;
        }

        .empty-slot {
            color: #ddd;
            font-size: 0.85rem;
            font-style: italic;
            padding: 0.3rem 0;
        }
    </style>
</head>

    <div class="back"><a href="index.html">← home</a></div>
