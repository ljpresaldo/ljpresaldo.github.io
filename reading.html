<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>reading list | lei jo</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .search-bar {
            width: 100%;
            padding: 0.5rem 0.75rem;
            font-family: 'Courier New', monospace;
            font-size: 0.88rem;
            border: 1px solid #ddd;
            background: #fff;
            color: #1a1a1a;
            outline: none;
            margin-bottom: 0.9rem;
        }
        .search-bar:focus { border-color: #6B8E66; }

        .filter-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.45rem;
            margin-bottom: 1.4rem;
        }

        .filter-btn {
            font-family: 'Courier New', monospace;
            font-size: 0.82rem;
            padding: 0.25rem 0.65rem;
            border: 1px solid #ccc;
            background: #fff;
            color: #555;
            cursor: pointer;
            transition: all 0.15s;
        }
        .filter-btn:hover { border-color: #6B8E66; color: #6B8E66; }
        .filter-btn.active { background: #6B8E66; border-color: #6B8E66; color: #fff; }

        .count { font-size: 0.8rem; color: #aaa; margin-bottom: 0.9rem; }

        table { width: 100%; border-collapse: collapse; }

        thead th {
            text-align: left;
            font-size: 0.78rem;
            color: #aaa;
            font-weight: normal;
            padding: 0 0.6rem 0.6rem 0.6rem;
            border-bottom: 1px solid #e8e8e8;
            letter-spacing: 0.03em;
        }

        tbody tr.entry-row {
            cursor: pointer;
            border-bottom: 1px solid #f0f0f0;
            transition: background 0.1s;
        }
        tbody tr.entry-row:hover { background: #fafafa; }
        tbody tr.entry-row td {
            padding: 0.65rem 0.6rem;
            font-size: 0.88rem;
            vertical-align: middle;
        }
        td.title-cell { font-weight: bold; color: #1a1a1a; }
        td.author-cell { color: #777; font-style: italic; }
        td.year-cell { color: #aaa; font-size: 0.82rem; white-space: nowrap; }

        .stars { color: #6B8E66; letter-spacing: 1px; white-space: nowrap; font-size: 0.82rem; }

        .tag-list { display: flex; flex-wrap: wrap; gap: 0.3rem; }
        .tag { font-size: 0.75rem; color: #888; border: 1px solid #e0e0e0; padding: 0.1rem 0.4rem; }

        .status-badge {
            font-size: 0.72rem;
            padding: 0.1rem 0.4rem;
            border: 1px solid;
        }
        .status-read { color: #6B8E66; border-color: #6B8E66; }
        .status-reading { color: #c4a35a; border-color: #c4a35a; }
        .status-want { color: #aaa; border-color: #ddd; }

        tr.expand-row td { padding: 0; border-bottom: 1px solid #e8e8e8; }
        .expand-inner {
            padding: 0.8rem 0.6rem 1rem 0.6rem;
            font-size: 0.85rem;
            color: #555;
            background: #fafafa;
            display: none;
        }

        .chevron {
            font-size: 0.7rem;
            color: #bbb;
            margin-left: 0.3rem;
            transition: transform 0.15s;
            display: inline-block;
        }
        tr.entry-row.open .chevron { transform: rotate(90deg); }

        .show-more-row td { padding-top: 1rem; text-align: center; }
        .show-more-btn {
            background: none;
            border: 1px solid #ddd;
            font-family: 'Courier New', monospace;
            font-size: 0.82rem;
            color: #888;
            padding: 0.3rem 1rem;
            cursor: pointer;
        }
        .show-more-btn:hover { border-color: #6B8E66; color: #6B8E66; }
        .empty { text-align: center; color: #bbb; font-size: 0.85rem; padding: 2rem 0; }
    </style>
</head>
<body>

    <div class="page-title">
        <h1>reading list ✦</h1>
        <p>books i am reading, loved, want to read</p>
    </div>

    <hr class="divider">

    <input class="search-bar" type="text" placeholder="search books..." id="searchInput">

    <div class="filter-row" id="filterRow">
        <button class="filter-btn active" data-filter="all">all</button>
        <button class="filter-btn" data-filter="status:read">read</button>
        <button class="filter-btn" data-filter="status:reading">reading</button>
        <button class="filter-btn" data-filter="status:want">want to read</button>
        <button class="filter-btn" data-filter="tag:favorites">★ favorites</button>
        <button class="filter-btn" data-filter="year:2026">2026</button>
        <button class="filter-btn" data-filter="year:2025">2025</button>
    </div>

    <div class="count" id="countLabel"></div>

    <table>
        <thead>
            <tr>
                <th style="width:32%">title</th>
                <th style="width:22%">author</th>
                <th style="width:9%">stars</th>
                <th style="width:8%">year</th>
                <th style="width:9%">status</th>
                <th>tags</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>

    <script src="sidebar.js"></script>
    <script src="reading-data.js"></script>
    <script>
        const PAGE_SIZE = 10;
        let activeFilter = 'all';
        let searchQuery = '';
        let showing = PAGE_SIZE;

        function starsHtml(n) {
            if (!n) return '<span style="color:#ddd;font-size:0.8rem;">—</span>';
            return '<span class="stars">' + '✦'.repeat(n) + '<span style="color:#e0e0e0">' + '✦'.repeat(5 - n) + '</span></span>';
        }

        function statusHtml(s) {
            const map = { read: 'read', reading: 'reading', want: 'want to read' };
            return `<span class="status-badge status-${s}">${map[s]}</span>`;
        }

        function filtered() {
            return readingData.filter(entry => {
                let match = true;
                if (activeFilter === 'all') match = true;
                else if (activeFilter.startsWith('status:')) match = entry.status === activeFilter.split(':')[1];
                else if (activeFilter.startsWith('tag:')) match = entry.tags.includes(activeFilter.split(':')[1]);
                else if (activeFilter.startsWith('year:')) match = entry.year === parseInt(activeFilter.split(':')[1]);

                const q = searchQuery.toLowerCase();
                const textMatch = !q ||
                    entry.title.toLowerCase().includes(q) ||
                    entry.author.toLowerCase().includes(q) ||
                    entry.tags.some(t => t.toLowerCase().includes(q));

                return match && textMatch;
            });
        }

        function render() {
            const data = filtered();
            const visible = data.slice(0, showing);
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            document.getElementById('countLabel').textContent =
                `${data.length} book${data.length === 1 ? '' : 's'}`;

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="empty">nothing here yet.</td></tr>`;
                return;
            }

            visible.forEach((entry, i) => {
                const tr = document.createElement('tr');
                tr.className = 'entry-row';
                tr.innerHTML = `
                    <td class="title-cell">${entry.title} <span class="chevron">▶</span></td>
                    <td class="author-cell">${entry.author}</td>
                    <td>${starsHtml(entry.stars)}</td>
                    <td class="year-cell">${entry.year || '—'}</td>
                    <td>${statusHtml(entry.status)}</td>
                    <td><div class="tag-list">${entry.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div></td>
                `;

                const expandTr = document.createElement('tr');
                expandTr.className = 'expand-row';
                expandTr.innerHTML = `<td colspan="6"><div class="expand-inner">${entry.notes || '<em>no notes yet.</em>'}</div></td>`;

                tr.addEventListener('click', () => {
                    const isOpen = tr.classList.contains('open');
                    document.querySelectorAll('tr.entry-row.open').forEach(r => r.classList.remove('open'));
                    document.querySelectorAll('tr.expand-row .expand-inner').forEach(el => el.style.display = 'none');
                    if (!isOpen) {
                        tr.classList.add('open');
                        expandTr.querySelector('.expand-inner').style.display = 'block';
                    }
                });

                tbody.appendChild(tr);
                tbody.appendChild(expandTr);
            });

            if (data.length > showing) {
                const moreTr = document.createElement('tr');
                moreTr.className = 'show-more-row';
                moreTr.innerHTML = `<td colspan="6"><button class="show-more-btn" id="showMoreBtn">show more (${data.length - showing} remaining)</button></td>`;
                tbody.appendChild(moreTr);
                document.getElementById('showMoreBtn').addEventListener('click', () => {
                    showing += PAGE_SIZE;
                    render();
                });
            }
        }

        document.getElementById('searchInput').addEventListener('input', e => {
            searchQuery = e.target.value;
            showing = PAGE_SIZE;
            render();
        });

        document.getElementById('filterRow').addEventListener('click', e => {
            const btn = e.target.closest('.filter-btn');
            if (!btn) return;
            activeFilter = btn.dataset.filter;
            showing = PAGE_SIZE;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            render();
        });

        render();
    </script>
</body>
</html>
