    <title>space out — lei jo</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .wip-banner {
            font-size: 0.8rem;
            color: #bbb;
            border: 1px dashed #e0e0e0;
            padding: 0.5rem 0.8rem;
            margin-bottom: 2rem;
            display: inline-block;
        }

        .post {
            margin-bottom: 2.2rem;
            padding-bottom: 2.2rem;
            border-bottom: 1px solid #f0f0f0;
        }

        .post:last-child {
            border-bottom: none;
        }

        .post-date {
            color: #bbb;
            font-size: 0.8rem;
            margin-bottom: 0.35rem;
        }

        .post-title {
            color: #1a1a1a;
            font-size: 0.95rem;
            font-weight: bold;
            margin-bottom: 0.4rem;
        }

        .post-title a {
            color: #1a1a1a;
            border-bottom: none;
        }

        .post-title a:hover {
            color: #6B8E66;
        }

        .post-preview {
            color: #666;
            font-size: 0.88rem;
            line-height: 1.65;
        }

        .post-tags {
            margin-top: 0.5rem;
            display: flex;
            gap: 0.35rem;
            flex-wrap: wrap;
        }

        .post-tag {
            font-size: 0.74rem;
            color: #aaa;
            border: 1px solid #e8e8e8;
            padding: 0.1rem 0.4rem;
        }

        .empty-state {
            color: #ccc;
            font-size: 0.88rem;
            font-style: italic;
            padding: 1rem 0;
        }
    </style>
</head>
